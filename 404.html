    .nf-btn-ghost{background:transparent;color:var(--rose,#5C3D3D);border:1px solid var(--gold,#C49A38);}
    .nf-btn-ghost:hover{background:var(--gold,#C49A38);color:#fff;}
    .nf-links{margin-top:2rem;font-family:var(--font-body,'Jost',sans-serif);font-size:.8rem;letter-spacing:.08em;color:var(--taupe,#766757);}
    .nf-links a{color:var(--rose,#5C3D3D);text-decoration:none;margin:0 .55rem;text-transform:uppercase;}
