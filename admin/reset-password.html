<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Password | Always & Forever Beauty</title>
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" />
  <style>
    :root { --cream:#FAF6F1; --gold:#C49A38; --rose:#5C3D3D; --taupe:#B5A49A; --peach:#F2C9B8; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem;
      font-family:'Jost',sans-serif;
      background:
        linear-gradient(rgba(245,237,228,0.55), rgba(245,237,228,0.55)),
        url('../images/gold-splatter.png') center / cover fixed,
        linear-gradient(135deg,#EDE4D9 0%,#DFD0C2 100%);
    }
    .card {
      position:relative; overflow:hidden; width:100%; max-width:440px; text-align:center;
      background:linear-gradient(170deg,#F5D8CB 0%,#F2C9B8 55%,#EAB6A1 100%);
      border:1px solid rgba(196,154,56,0.45); border-radius:6px; padding:3rem 2.5rem;
      box-shadow:0 10px 50px rgba(92,61,61,0.18), 0 0 36px rgba(236,170,140,0.28);
    }
    .card::before { content:""; position:absolute; inset:10px; border:1px solid rgba(196,154,56,0.3); pointer-events:none; z-index:1; }
    .card > * { position:relative; z-index:2; }
    .logo {
      font-family:'Great Vibes',cursive; font-size:clamp(1.9rem,8vw,2.5rem); display:block; line-height:1.35; padding-top:0.12em; margin-bottom:0.3rem;
      color:var(--gold);
      background:linear-gradient(105deg,#7E5C1C 0%,#A87E2A 22%,#D9B45C 45%,#C49A38 60%,#8A6420 82%,#A87E2A 100%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    }
    h1 { font-family:'Playfair Display',serif; font-size:1.2rem; color:var(--rose); margin-bottom:0.5rem; }
    .intro { font-size:0.9rem; color:rgba(92,61,61,0.8); margin-bottom:1.75rem; line-height:1.5; }
    .field { margin-bottom:1.1rem; text-align:left; }
    .field label { display:block; font-size:0.78rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--rose); font-weight:600; margin-bottom:0.4rem; }
    .field input {
      width:100%; padding:0.8rem 1rem; border:1px solid var(--peach); background:#fff; color:var(--rose);
      font-family:'Jost',sans-serif; font-size:0.95rem; border-radius:3px; outline:none; transition:border-color 0.2s;
    }
    .field input:focus { border-color:var(--gold); }
    .btn {
      width:100%; padding:0.9rem; background:var(--rose); color:#fff; border:none; border-radius:3px;
      font-family:'Jost',sans-serif; font-size:0.8rem; letter-spacing:0.12em; text-transform:uppercase; font-weight:500;
      cursor:pointer; margin-top:0.4rem; transition:background 0.2s;
    }
    .btn:hover { background:#7a5050; }
    .btn:disabled { opacity:0.6; cursor:not-allowed; }
    .msg { display:none; margin-top:1rem; padding:0.75rem 1rem; border-radius:3px; font-size:0.85rem; }
    .msg.error { display:block; background:rgba(192,57,43,0.1); border:1px solid rgba(192,57,43,0.25); color:#c0392b; }
    .msg.ok { display:block; background:rgba(46,125,81,0.12); border:1px solid rgba(46,125,81,0.25); color:#2E7D51; }
  </style>
</head>
<body>
  <div class="card">
    <span class="logo">Always &amp; Forever Beauty</span>
    <h1 id="title">Set a New Password</h1>
    <p class="intro" id="intro">Choose a password you'll remember.</p>
    <form id="pwForm">
      <div class="field">
        <label for="pw1">New Password</label>
        <input type="password" id="pw1" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="pw2">Confirm Password</label>
        <input type="password" id="pw2" required minlength="6" placeholder="Type it again" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn" id="saveBtn">Save Password</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = supabase.createClient(
      'https://bikidhccblbhibaniduw.supabase.co',
      'sb_publishable_uQG4MBWVmanCL7oOUWiYEg_eMI5FdBE'
    );
    const msg = document.getElementById('msg');
    function showMsg(text, type) { msg.className = 'msg ' + type; msg.textContent = text; }

    // Need a session (either a normal login, or a recovery session from the reset email link)
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        // No session — can't set a password here; send them to log in
        showMsg('This link has expired. Please log in (or use “Forgot password” again).', 'error');
        setTimeout(() => { window.location.href = 'login.html'; }, 2500);
        return;
      }
      if (session.user && session.user.user_metadata && session.user.user_metadata.must_change_password) {
        document.getElementById('title').textContent = 'Welcome! Set your password';
        document.getElementById('intro').textContent = 'For your security, please choose your own password to continue.';
      }
    })();

    document.getElementById('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      const btn = document.getElementById('saveBtn');
      msg.className = 'msg';
      if (pw1 !== pw2) { showMsg('Those passwords don\'t match.', 'error'); return; }
      if (pw1.length < 6) { showMsg('Please use at least 6 characters.', 'error'); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = await sb.auth.updateUser({ password: pw1, data: { must_change_password: false } });
      if (error) {
        btn.disabled = false; btn.textContent = 'Save Password';
        showMsg(error.message, 'error');
        return;
      }
      showMsg('Password saved! Taking you to your dashboard…', 'ok');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
    });
  </script>
</body>
</html>
