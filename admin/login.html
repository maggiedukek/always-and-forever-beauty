<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Always & Forever Beauty</title>
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" />
  <style>
    :root {
      --cream: #FAF6F1;
      --gold:  #C49A38;
      --rose:  #5C3D3D;
      --taupe: #B5A49A;
      --peach: #F2C9B8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(245,237,228,0.55), rgba(245,237,228,0.55)),
        url('../images/gold-splatter.png') center / cover fixed,
        linear-gradient(135deg, #EDE4D9 0%, #DFD0C2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Jost', sans-serif;
      padding: 2rem;
    }

    .login-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(170deg, #F5D8CB 0%, #F2C9B8 55%, #EAB6A1 100%);
      border: 1px solid rgba(196,154,56,0.45);
      border-radius: 6px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 50px rgba(92,61,61,0.18), 0 0 36px rgba(236,170,140,0.28);
      text-align: center;
    }
    /* Gold floral watermark behind the card */
    .login-card::after {
      content: "";
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: url('../images/background gold flowers.png') center / cover no-repeat;
      opacity: 0.1;
    }
    /* Inner gold frame line */
    .login-card::before {
      content: "";
      position: absolute; inset: 10px; z-index: 1; pointer-events: none;
      border: 1px solid rgba(196,154,56,0.3);
    }
    .login-card > * { position: relative; z-index: 2; }

    .login-logo-img {
      display: block;
      width: 220px;
      max-width: 72%;
      height: auto;
      margin: 0 auto 0.7rem;
      padding: 0.6rem 0.9rem 0.5rem;
      /* Soft cream halo behind the gold logo so it reads on the peach card */
      background: radial-gradient(ellipse 80% 74% at 50% 46%, rgba(255,253,249,0.97) 30%, rgba(255,253,249,0) 78%);
      filter: contrast(1.05) saturate(1.08);
    }

    .login-sub {
      font-size: 0.74rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--rose);
      font-weight: 500;
      margin-bottom: 2.5rem;
      display: block;
    }

    .login-divider {
      width: 40px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 2.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--rose);
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--peach);
      background: #fff;
      color: var(--rose);
      font-family: 'Jost', sans-serif;
      font-size: 0.95rem;
      border-radius: 3px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus { border-color: var(--gold); }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: var(--rose);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: 'Jost', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }

    .btn-login:hover { background: #7a5050; }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-error {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(192, 57, 43, 0.08);
      border: 1px solid rgba(192, 57, 43, 0.2);
      border-radius: 3px;
      color: #c0392b;
      font-size: 0.85rem;
    }

    .login-footer {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: rgba(92,61,61,0.72);
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: rgba(92,61,61,0.72);
      text-decoration: none;
      letter-spacing: 0.08em;
    }

    .back-link:hover { color: var(--rose); }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="../images/logo-stacked-transparent.png" alt="Always & Forever Beauty" class="login-logo-img" />
    <span class="login-sub">Admin Portal</span>
    <div class="login-divider"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="admin@email.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
      <div class="login-error" id="loginError"></div>
    </form>

    <p class="login-footer">This page is for Colleen only — not publicly linked.</p>
    <a href="../index.html" class="back-link">← Back to website</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://bikidhccblbhibaniduw.supabase.co',
      'sb_publishable_uQG4MBWVmanCL7oOUWiYEg_eMI5FdBE'
    );

    // Redirect if already logged in
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      errEl.style.display = 'none';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = error.message;
        errEl.style.display = 'block';
        btn.textContent = 'Sign In';
        btn.disabled = false;
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
